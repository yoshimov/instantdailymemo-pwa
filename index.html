<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <meta name="description" content="起動したらすぐ今日の日記を書ける PWA">
    <title>Instant Daily Memo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Instant Daily Memo">
      <header class="topbar">
        <div>
          <p class="app-name">Instant Daily Memo</p>
          <button class="date-button" id="dateButton" type="button"></button>
        </div>
        <div class="top-actions">
          <span class="version">v0.1 PWA</span>
          <button class="icon-button" id="settingsButton" type="button" aria-label="設定" title="設定">
            <span aria-hidden="true">...</span>
          </button>
        </div>
      </header>

      <p class="status" id="statusText" role="status" aria-live="polite">読み込み中...</p>

      <section class="editor-wrap" aria-label="今日の日記">
        <textarea id="memoText" spellcheck="true" autocomplete="off" placeholder="今日の日記"></textarea>
        <div class="scroll-track" aria-hidden="true">
          <div class="scroll-thumb" id="scrollThumb"></div>
        </div>
      </section>

      <footer class="actionbar">
        <button class="icon-button" id="voiceButton" type="button" aria-label="音声入力" title="音声入力">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"></path>
            <path d="M19 11a7 7 0 0 1-14 0"></path>
            <path d="M12 18v4"></path>
            <path d="M8 22h8"></path>
          </svg>
        </button>
        <button class="primary-button" id="saveButton" type="button">保存</button>
        <button class="secondary-button" id="calendarButton" type="button">カレンダー</button>
      </footer>
    </main>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog" class="settings-panel">
        <header class="dialog-header">
          <h1>設定</h1>
          <button class="icon-button" value="close" aria-label="閉じる" title="閉じる">
            <span aria-hidden="true">x</span>
          </button>
        </header>

        <div class="setting-row">
          <div>
            <strong>保存先</strong>
            <p>Google Calendar API が有効な時は今日の memo 予定にも保存します</p>
          </div>
          <span class="setting-value" id="googleStatus">未接続</span>
        </div>

        <label class="field-row">
          <span>OAuth クライアント ID</span>
          <input id="clientIdInput" type="text" inputmode="url" autocomplete="off" placeholder="xxxxx.apps.googleusercontent.com">
        </label>

        <label class="field-row">
          <span>カレンダー ID</span>
          <input id="calendarIdInput" type="text" autocomplete="off" value="primary">
        </label>

        <div class="dialog-actions">
          <button class="primary-button" id="googleSignInButton" type="button">Google 接続</button>
          <button class="secondary-button" id="googleSignOutButton" type="button">解除</button>
        </div>

        <div class="setting-row">
          <div>
            <strong>共有テキスト</strong>
            <p>共有された本文は今日の日記末尾に追加します</p>
          </div>
          <span class="setting-value" id="shareStatus">待機中</span>
        </div>

        <div class="dialog-actions">
          <button class="secondary-button" id="exportButton" type="button">JSON 書き出し</button>
          <button class="secondary-button" id="icsButton" type="button">ICS 保存</button>
        </div>

        <nav class="legal-links" aria-label="公開文書">
          <a href="privacy-policy.html" target="_blank" rel="noopener">プライバシーポリシー</a>
          <a href="terms.html" target="_blank" rel="noopener">利用規約</a>
        </nav>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js" type="module"></script>
  </body>
</html>
